<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chennai Geotechnical Soil Analysis System</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 30px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            max-width: 700px;
            width: 100%;
        }
        h1 { color: #2c3e50; text-align: center; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; color: #34495e; }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background-color: #219150; }
        
        .error-box {
            margin-top: 25px;
            padding: 15px 20px;
            background-color: #f8d7da;
            color: #721c24;
            border-radius: 6px;
            border: 1px solid #f5c6cb;
            font-weight: bold;
            text-align: center;
            font-size: 16px;
        }

        .results {
            margin-top: 25px;
            padding: 20px;
            background-color: #f8faf9;
            border-radius: 8px;
            border: 1px solid #e1e8e5;
        }
        .results h2 { margin-top: 0; color: #2c3e50; border-bottom: 2px solid #27ae60; padding-bottom: 8px; }
        
        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        .data-table td {
            padding: 10px 12px;
            border-bottom: 1px solid #e1e8e5;
            font-size: 14px;
        }
        .data-table td.key {
            font-weight: bold;
            color: #2c3e50;
            width: 50%;
        }
        .highlight {
            background-color: #eef9f2;
            font-weight: bold;
            color: #1e7e34;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏗️ Chennai Geotechnical Soil Analysis</h1>
        
        <form action="/" method="POST">
            <div class="form-group">
                <label for="latitude">Latitude (Range: 12.7817 to 13.1740):</label>
                <input type="text" id="latitude" name="latitude" placeholder="e.g. 13.0065" required>
            </div>
            <div class="form-group">
                <label for="longitude">Longitude (Range: 80.0940 to 80.3010):</label>
                <input type="text" id="longitude" name="longitude" placeholder="e.g. 80.2210" required>
            </div>
            <button type="submit">Analyze Geotechnical Properties</button>
        </form>

        {% if error_message %}
        <div class="error-box">
            ⚠️ {{ error_message }}
        </div>
        {% endif %}

        {% if result %}
        <div class="results">
            <h2>Geotechnical Analysis Result</h2>
            <table class="data-table">
                {% for key, value in result.items() %}
                <tr class="{% if key == 'Recommended Foundation' or key == 'Bearing Capacity (kN/m²)' %}highlight{% endif %}">
                    <td class="key">{{ key }}</td>
                    <td>{{ value }}</td>
                </tr>
                {% endfor %}
            </table>
        </div>
        {% endif %}
    </div>
</body>
</html>
